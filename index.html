
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Talita Basus</title>

  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
    }

    body {
      min-height: 100svh;
      color: #111;
      font-family: "Outfit", sans-serif;
    }

    /* PASSWORD SCREEN */
    .login-screen {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fff;
    }

    .login-content {
      width: 100%;
      max-width: 340px;
      text-align: center;
    }

    .login-content h1 {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 400;
    }

    .login-content p {
      margin: 0 0 28px;
      color: #666;
      font-size: 15px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .login-form input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1px solid #dedede;
      border-radius: 0;
      background: #fff;
      color: #111;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    .login-form input:focus {
      border-color: #777;
    }

    .login-form button {
      height: 46px;
      border: 1px solid #111;
      border-radius: 0;
      background: #111;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      cursor: pointer;
    }

    .login-form button:hover {
      background: #333;
    }

    .login-error {
      min-height: 18px;
      margin-top: 14px;
      color: #b33;
      font-size: 13px;
    }

    .login-screen[hidden],
    .portfolio[hidden] {
      display: none;
    }

    /* PORTFOLIO */
    .portfolio {
      min-height: 100svh;
      display: grid;
      grid-template-rows: 8.2vh minmax(0, 1fr) 10vh;
    }

    .site-header {
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      padding: 2.1vh 1.5vw 0;
    }

    .logo {
      display: block;
      width: clamp(112px, 15vw, 170px);
      height: auto;
    }

    .hero {
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      outline: none;
    }

    /* PHOTO AND CAPTIONS */
    .photo-frame {
      display: flex;
      flex-direction: column;
      width: fit-content;
      max-width: min(58.1vw, 900px);
    }

    .photo-frame img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
      opacity: 1;
      transition: opacity 280ms ease;
      pointer-events: none;
    }

    .photo-frame img.is-changing {
      opacity: 0;
    }

    .photo-caption {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      gap: 12px;
      margin-top: 8px;
      color: #111;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.4;
    }

    #photo-location {
      text-align: left;
    }

    #photo-date {
      text-align: right;
      flex-shrink: 0;
    }

    .site-footer {
      border-top: 1px solid #e5e5e5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      font-size: 16px;
      font-weight: 400;
    }

    .site-footer a {
      color: #111;
      text-decoration: none;
    }

    @media (max-width: 640px) {
      .portfolio {
        grid-template-rows: 8vh minmax(0, 1fr) 9vh;
      }

      .site-header {
        padding: 2vh 3vw 0;
      }

      .logo {
        width: clamp(105px, 29vw, 145px);
      }

      .hero {
        padding: 0 12px;
      }

      .photo-frame {
        max-width: 88vw;
      }

      .photo-frame img {
        max-height: 70vh;
      }

      .photo-caption {
        font-size: 13px;
        gap: 8px;
        margin-top: 7px;
      }

      .site-footer {
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .photo-frame img {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <!-- PASSWORD SCREEN -->
  <section class="login-screen" id="login-screen">
    <div class="login-content">
      <h1>A little something to see.</h1>
      <p>Enter the password to view the portfolio.</p>

      <form class="login-form" id="login-form">
        <input
          type="password"
          id="password-input"
          placeholder="Password"
          aria-label="Password"
          autocomplete="current-password"
          required
        >
        <button type="submit">Enter</button>
      </form>

      <div class="login-error" id="login-error" aria-live="polite"></div>
    </div>
  </section>

  <!-- PORTFOLIO -->
  <div class="portfolio" id="portfolio" hidden>

    <header class="site-header">
      <img class="logo" src="logo.png" alt="Talita Basus">
    </header>

    <main class="hero" id="hero" role="button" tabindex="0"
          aria-label="Show next photograph">

      <div class="photo-frame">
        <img id="hero-photo" src="photos/photo-01.jpg" alt="">

        <div class="photo-caption">
          <span id="photo-location"></span>
          <span id="photo-date"></span>
        </div>
      </div>

    </main>

    <footer class="site-footer">
      <a href="mailto:talitabasus@gmail.com">talitabasus@gmail.com</a>
    </footer>

  </div>

  <script>
    // SET YOUR NEW PASSWORD HERE
    const PASSWORD = "littlestar";

    // PASSWORD SCREEN
    const loginScreen = document.getElementById("login-screen");
    const loginForm = document.getElementById("login-form");
    const passwordInput = document.getElementById("password-input");
    const loginError = document.getElementById("login-error");
    const portfolio = document.getElementById("portfolio");

    function unlockPortfolio() {
      loginScreen.hidden = true;
      portfolio.hidden = false;
      sessionStorage.setItem("portfolioAccess", "granted");
    }

    if (sessionStorage.getItem("portfolioAccess") === "granted") {
      unlockPortfolio();
    }

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();

      if (passwordInput.value === PASSWORD) {
        loginError.textContent = "";
        unlockPortfolio();
      } else {
        loginError.textContent = "Incorrect password. Please try again.";
        passwordInput.value = "";
        passwordInput.focus();
      }
    });

    // SLIDESHOW PHOTOS
    const photos = [
      "photos/photo-01.jpg",
      "photos/photo-02.JPG",
      "photos/photo-03.JPG",
      "photos/photo-04.jpg",
      "photos/photo-05.JPG",
      "photos/photo-06.JPG",
      "photos/photo-07.jpg"
    ];

    // LOCATION AND DATE FOR EACH PHOTO
    const photoDetails = [
      { location: "Puerto Escondido, Oaxaca, MX", date: "May 2026" },
      { location: "Puerto Escondido, Oaxaca, MX", date: "May 2026" },
      { location: "Puerto Escondido, Oaxaca, MX", date: "May 2026" },
      { location: "Boracay, Aklan, PH", date: "June 2025" },
      { location: "Osaka, Osaka-fu, JP", date: "July 2025" },
      { location: "Osaka, Osaka-fu, JP", date: "July 2025" },
      { location: "Boracay, Aklan, PH", date: "June 2025" }
    ];

    const hero = document.getElementById("hero");
    const image = document.getElementById("hero-photo");
    const locationCaption = document.getElementById("photo-location");
    const dateCaption = document.getElementById("photo-date");

    let current = 0;
    let changing = false;

    function updateCaption(index) {
      locationCaption.textContent = photoDetails[index].location;
      dateCaption.textContent = photoDetails[index].date;
    }

    // INITIAL CAPTION
    updateCaption(current);

    // NEXT PHOTO
    function showNextPhoto() {
      if (changing || photos.length < 2) return;

      changing = true;
      const next = (current + 1) % photos.length;
      const preload = new Image();

      preload.onload = () => {
        image.classList.add("is-changing");

        window.setTimeout(() => {
          image.src = photos[next];
          current = next;
          updateCaption(current);
          image.classList.remove("is-changing");
          changing = false;
        }, 280);
      };

      preload.onerror = () => {
        changing = false;
      };

      preload.src = photos[next];
    }

    hero.addEventListener("click", showNextPhoto);

    hero.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        showNextPhoto();
      }
    });
  </script>

</body>
</html>
