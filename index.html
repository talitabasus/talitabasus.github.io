<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Talita Basus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; }
    body {
      min-height: 100svh;
      display: grid;
      grid-template-rows: 8.2vh minmax(0, 1fr) 10vh;
      color: #111;
      font-family: "Outfit", sans-serif;
    }
    .site-header {
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      padding: 2.1vh 1.5vw 0;
    }
    .logo {
      display: block;
      width: clamp(112px, 15vw, 170px);
      height: auto;
    }
    .hero {
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      outline: none;
    }
    .hero img {
      display: block;
      max-width: min(58.1vw, 900px);
      max-height: 73.5vh;
      width: auto;
      height: auto;
      object-fit: contain;
      opacity: 1;
      transition: opacity 280ms ease;
      pointer-events: none;
    }
    .hero img.is-changing { opacity: 0; }
    .site-footer {
      border-top: 1px solid #e5e5e5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      font-family: "Outfit", sans-serif;
      font-size: 16px;
      font-weight: 400;
    }
    .site-footer a { color: #111; text-decoration: none; }
    @media (max-width: 640px) {
      body { grid-template-rows: 8vh minmax(0, 1fr) 9vh; }
      .site-header { padding: 2vh 3vw 0; }
      .logo { width: clamp(105px, 29vw, 145px); }
      .hero { padding: 0 12px; }
      .hero img { max-width: 88vw; max-height: 76vh; }
      .site-footer { font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero img { transition: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <img class="logo" src="logo.png" alt="Talita Basus">
  </header>

  <main class="hero" id="hero" role="button" tabindex="0"
        aria-label="Show next photograph">
    <img id="hero-photo" src="photos/photo-01.jpg" alt="">
  </main>

  <footer class="site-footer">
    <a href="mailto:talitabasus@gmail.com">talitabasus@gmail.com</a>
  </footer>

  <script>
    // Add each uploaded image filename here, in the order it should appear.
    const photos = [
      "photos/photo-01.jpg",
      "photos/photo-02.JPG",
      "photos/photo-03.JPG",
      "photos/photo-04.JPG",
      "photos/photo-05.JPG",
    ];

    const hero = document.getElementById("hero");
    const image = document.getElementById("hero-photo");
    let current = 0;
    let changing = false;

    function showNextPhoto() {
      if (changing || photos.length < 2) return;
      changing = true;
      const next = (current + 1) % photos.length;
      const preload = new Image();

      preload.onload = () => {
        image.classList.add("is-changing");
        window.setTimeout(() => {
          image.src = photos[next];
          current = next;
          image.classList.remove("is-changing");
          changing = false;
      }, 280);
      };
      preload.onerror = () => { changing = false; };
      preload.src = photos[next];
    }

    hero.addEventListener("click", showNextPhoto);
    hero.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        showNextPhoto();
      }
    });
  </script>
</body>
</html>
